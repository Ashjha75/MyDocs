<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <meta name="description" content="The page you requested could not be found.">
    
    <!-- Tailwind CSS is no longer needed as we use custom properties -->
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- GitHub Color Palette --- */
        :root {
            --gh-bg-canvas: #0d1117;
            --gh-bg-surface: #161b22;
            --gh-border-default: #30363d;
            --gh-text-fg: #c9d1d9;
            --gh-text-muted: #8b949e;
            --gh-text-link: #58a6ff;
            --gh-text-heading: #e6edf3;
            --gh-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* --- Base & Layout --- */
        body {
            font-family: var(--gh-font-sans);
            background-color: var(--gh-bg-canvas);
            color: var(--gh-text-fg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            margin: 0;
        }

        main {
            width: 100%;
            max-width: 56rem; /* 896px */
            background-color: var(--gh-bg-surface);
            border: 1px solid var(--gh-border-default);
            border-radius: 1rem; /* 16px */
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            overflow: hidden;
            display: grid;
        }
        
        @media (min-width: 768px) {
            main {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* --- Content & Typography --- */
        .content-section {
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h1 {
            font-size: 3rem; /* 48px */
            font-weight: 700;
            color: var(--gh-text-link);
            margin-bottom: 1rem;
        }
        
        h2 {
            font-size: 1.875rem; /* 30px */
            font-weight: 700;
            color: var(--gh-text-heading);
            margin-bottom: 1rem;
        }
        
        p {
            color: var(--gh-text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* --- Buttons & Actions --- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            transform: translateY(0);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        
        .btn-primary {
            background-color: var(--gh-text-link);
            color: var(--gh-bg-canvas);
        }
        
        .btn-secondary {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--gh-text-link);
            border: 1px solid var(--gh-border-default);
        }

        /* --- Search Form --- */
        .search-form {
            position: relative;
        }
        
        #siteSearch {
            width: 100%;
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            background-color: var(--gh-bg-canvas);
            border: 1px solid var(--gh-border-default);
            border-radius: 0.5rem;
            color: var(--gh-text-fg);
            outline: none;
            transition: border-color 0.2s;
        }
        
        #siteSearch:focus {
            border-color: var(--gh-text-link);
        }
        
        #searchBtn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 0.5rem;
            color: var(--gh-text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        #searchBtn:hover {
            color: var(--gh-text-link);
        }

        /* --- Footer & Illustration --- */
        .footer-note {
            font-size: 0.75rem;
            color: var(--gh-text-muted);
            margin-top: 1.5rem;
        }
        
        .footer-note a {
            color: var(--gh-text-link);
            text-decoration: none;
        }
        
        .footer-note a:hover {
            text-decoration: underline;
        }
        
        .illustration-section {
            display: none; /* Hidden on small screens */
        }

        @media (min-width: 768px) {
            .illustration-section {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                background-color: rgba(13, 17, 23, 0.5);
            }
        }
        
        .illustration-wrapper {
            width: 100%;
            max-width: 24rem; /* 384px */
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <main>
        
        <section class="content-section">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>
                Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or maybe you just mistyped the URL.
            </p>

            <div class="actions">
                <a href="/" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Go Home
                </a>
                <button onclick="history.back()" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                    Go Back
                </button>
            </div>

            <div class="search-form">
                <input id="siteSearch" type="search" placeholder="Search the site...">
                <button id="searchBtn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
            </div>

            <p class="footer-note">
                If you believe this is an error, please <a href="mailto:support@example.com">contact support</a>.
            </p>
        </section>

        <aside class="illustration-section">
            <div class="illustration-wrapper">
                <svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paper plane flying over stylized buildings">
                    <defs>
                      <linearGradient id="g1" x1="0" x2="1">
                        <stop offset="0" stop-color="#7dd3fc"/>
                        <stop offset="1" stop-color="#60a5fa"/>
                      </linearGradient>
                      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity="0.6"/>
                      </filter>
                    </defs>
                    <rect x="0" y="260" width="520" height="100" fill="#0d1117"/>
                    <g transform="translate(40,120)">
                      <rect x="0" y="80" width="80" height="120" rx="8" fill="#161b22" />
                      <rect x="110" y="30" width="100" height="170" rx="8" fill="#0d1117" />
                      <rect x="240" y="60" width="120" height="140" rx="8" fill="#161b22"/>
                    </g>
                    <path id="path" d="M -40 230 C 80 150, 240 120, 480 80" fill="none" stroke="transparent"/>
                    <g transform="translate(0,0)">
                      <g id="plane" transform="translate(-40,230) scale(0.9)" filter="url(#shadow)">
                        <polygon points="0,0 60,12 12,24" fill="url(#g1)"/>
                        <polygon points="12,24 60,12 48,42" fill="#cfeefd" opacity="0.9"/>
                      </g>
                    </g>
                    <g opacity="0.4" fill="#c9d1d9">
                      <circle cx="380" cy="40" r="3"/>
                      <circle cx="420" cy="70" r="2.2"/>
                      <circle cx="320" cy="30" r="2.6"/>
                    </g>
                    <script>
                      (function(){
                        const svg = document.currentScript.ownerDocument;
                        const plane = svg.getElementById('plane');
                        const path = svg.getElementById('path');
                        if(!plane || !path) return;
                        const len = path.getTotalLength ? path.getTotalLength() : 600;
                        let t=0;
                        function tick(){
                          t+=0.0055;
                          if(t>1) t=1;
                          const pt = path.getPointAtLength(len * t);
                          const ahead = path.getPointAtLength(Math.min(len, len * (t+0.02)));
                          const angle = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180/Math.PI;
                          plane.setAttribute('transform', `translate(${pt.x-20},${pt.y-20}) rotate(${angle}) scale(0.9)`);
                          requestAnimationFrame(t<1 ? tick : function(){ setTimeout(function(){ t=0; requestAnimationFrame(tick); }, 800); });
                        }
                        requestAnimationFrame(tick);
                      })();
                    </script>
                </svg>
            </div>
        </aside>

    </main>

    <script>
        (function(){
            const searchBtn = document.getElementById('searchBtn');
            const siteSearch = document.getElementById('siteSearch');
            
            function performSearch() {
                const query = siteSearch.value.trim();
                if (!query) {
                    siteSearch.focus();
                    return;
                }
                const searchURL = 'https://www.google.com/search?q=site:' + location.hostname + '+' + encodeURIComponent(query);
                window.location.href = searchURL;
            }

            searchBtn?.addEventListener('click', performSearch);
            siteSearch?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        })();
    </script>
</body>
</html>
